<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cute+Font&display=swap" rel="stylesheet">
    {% if page.game_fragment == true %}
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/hacktivity-theme.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    
    {% if site.plugins contains 'jekyll-feed' %}
        <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title | escape }}" />
    {% endif %}
</head>

<body class="{% if page.game_fragment == true %}game-fragment{% endif %}">
    <script>
        // Check for embedded query parameter
        if (window.location.search.includes('embedded')) {
            document.body.classList.add('embedded-mode');
        }
    </script>
    
    {% unless page.embed or site.embedded %}
    <header class="site-header">
        <div class="wrapper">
            <a href="https://hacktivity.co.uk"><img src="{{ '/assets/images/hacktivity-logo.svg' | relative_url }}" alt="Hacktivity Logo" class="hacktivity-logo"></a></span>
            <!-- <a class="nav-link" href="{{ '/' | relative_url }}">Sheets</a>
            <a class="nav-link" href="https://github.com/{{ site.github.repository_name }}" target="_blank">GitHub</a> -->
            
        </div>
    </header>
    {% endunless %}

    <main class="page-content">
        <div class="wrapper">
            {{ content }}
        </div>
    </main>

    {% unless page.embed or site.embedded %}
    <footer class="site-footer">
        <div class="wrapper">
            <p class="footer-text">
                <a href="https://github.com/cliffe/{{ site.github.repository_name }}">View on GitHub</a>
            </p>
        </div>
    </footer>
    {% endunless %}

    <script type="module">
        // kramdown renders ```mermaid fences as <pre><code class="language-mermaid">.
        // Hide them up front so the graph source doesn't sit on screen until
        // mermaid swaps in the SVG. With JS off nothing hides and the source
        // stays readable, which is the fallback we want.
        const fences = () => document.querySelectorAll('pre > code.language-mermaid');
        fences().forEach(c => { c.parentElement.style.visibility = 'hidden'; });

        const start = async () => {
            // Must run after lab.html's DOMContentLoaded handler, which rewrites
            // .lab-content-body innerHTML for the ==highlight== syntax. Each of those
            // assignments rebuilds every child node, so any element reference taken
            // before it goes stale — hence re-querying here rather than reusing.
            const codes = fences();
            if (!codes.length) return;

            // textContent undoes kramdown's escaping of <b>/<br/> inside node labels.
            const hosts = [...codes].map(code => {
                const host = document.createElement('pre');
                host.className = 'mermaid';
                host.dataset.src = code.textContent;
                host.textContent = code.textContent;
                host.style.visibility = 'hidden';
                code.parentElement.replaceWith(host);
                return host;
            });

            const reveal = () => hosts.forEach(h => { h.style.visibility = ''; });

            // Give each diagram a fixed-height viewport to pan/zoom inside. Without a
            // definite height, svg-pan-zoom has nothing to fit the graph to.
            const views = hosts.map(host => {
                const viewport = document.createElement('div');
                viewport.className = 'mermaid-viewport';
                host.parentNode.insertBefore(viewport, host);
                viewport.appendChild(host);
                viewport.insertAdjacentHTML('beforeend', `
                    <div class="mermaid-controls">
                        <button type="button" data-act="in"   title="Zoom in">+</button>
                        <button type="button" data-act="out"  title="Zoom out">&minus;</button>
                        <button type="button" data-act="fit"  title="Fit to view">Fit</button>
                        <button type="button" data-act="full" title="Fullscreen">&#9974;</button>
                    </div>`);
                return { host, viewport, pz: null };
            });

            // svg-pan-zoom ships as UMD, same build the dungeon graph uses.
            const loadScript = src => new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src; s.onload = res; s.onerror = rej;
                document.head.appendChild(s);
            });

            const attachPanZoom = () => {
                const svgPanZoom = window.svgPanZoom;
                if (!svgPanZoom) return;
                for (const v of views) {
                    if (v.pz) { try { v.pz.destroy(); } catch (_) {} v.pz = null; }
                    const svg = v.host.querySelector('svg');
                    if (!svg) continue;
                    // mermaid sizes the SVG to its content; let it fill the viewport instead.
                    svg.style.maxWidth = 'none';
                    svg.setAttribute('width', '100%');
                    svg.setAttribute('height', '100%');
                    try {
                        v.pz = svgPanZoom(svg, {
                            zoomEnabled: true,
                            controlIconsEnabled: false,
                            mouseWheelZoomEnabled: true,
                            fit: true,
                            center: true,
                            minZoom: 0.2,
                            maxZoom: 20,
                            zoomScaleSensitivity: 0.3
                        });
                    } catch (e) {
                        console.error('svg-pan-zoom: failed to attach', e);
                    }
                }
            };

            // Controls, delegated so they survive re-renders.
            document.addEventListener('click', e => {
                const btn = e.target.closest('.mermaid-controls button');
                if (!btn) return;
                const v = views.find(x => x.viewport === btn.closest('.mermaid-viewport'));
                if (!v || !v.pz) return;
                const act = btn.dataset.act;
                if (act === 'in') v.pz.zoomIn();
                else if (act === 'out') v.pz.zoomOut();
                else if (act === 'fit') { v.pz.fit(); v.pz.center(); }
                else if (act === 'full') {
                    if (document.fullscreenElement) document.exitFullscreen();
                    else v.viewport.requestFullscreen();
                }
            });

            // Fullscreen resizes the viewport out from under the SVG, and
            // svg-pan-zoom caches those dimensions. Re-measure once the
            // fullscreen layer has actually laid out, not on a guessed timer.
            document.addEventListener('fullscreenchange', () => {
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    views.forEach(v => {
                        if (!v.pz) return;
                        v.pz.resize(); v.pz.fit(); v.pz.center();
                    });
                }));
            });

            try {
                const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');

                // Zoom is an enhancement: if this CDN is down the diagrams still render.
                try {
                    await loadScript('https://cdn.jsdelivr.net/npm/svg-pan-zoom@3/dist/svg-pan-zoom.min.js');
                } catch (e) {
                    console.error('svg-pan-zoom unavailable; diagrams will render without zoom', e);
                }

                const render = async () => {
                    // mermaid.run() consumes the element, so restore the source each pass.
                    hosts.forEach(h => {
                        h.textContent = h.dataset.src;
                        h.removeAttribute('data-processed');
                    });
                    mermaid.initialize({
                        startOnLoad: false,
                        theme: document.body.dataset.theme === 'light' ? 'default' : 'dark',
                        flowchart: { htmlLabels: true, useMaxWidth: true }
                    });
                    // Render one at a time: a single bad diagram then can't
                    // take the rest of the page's diagrams down with it.
                    for (const h of hosts) {
                        try {
                            await mermaid.run({ nodes: [h] });
                        } catch (e) {
                            console.error('mermaid: diagram failed to render', e);
                        }
                    }
                    attachPanZoom();
                };

                await render();
                reveal();

                // Diagrams reflow the page after load, which strands the browser's
                // initial jump to a #hash partway up the document. Re-apply it.
                if (location.hash) {
                    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
                    if (target) target.scrollIntoView();
                }

                // Re-render on theme toggle: mermaid bakes colours into the generated SVG.
                new MutationObserver(render).observe(document.body, {
                    attributes: true, attributeFilter: ['data-theme']
                });
            } catch (e) {
                // Mermaid unreachable: show the graph source rather than a blank gap.
                reveal();
                console.error('mermaid unavailable; showing diagram source', e);
            }
        };

        // 'load' rather than DOMContentLoaded: guarantees we run after every
        // DOMContentLoaded handler, regardless of script order.
        if (document.readyState === 'complete') start();
        else window.addEventListener('load', start);
    </script>
</body>
</html>
