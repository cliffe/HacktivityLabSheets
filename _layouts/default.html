<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cute+Font&display=swap" rel="stylesheet">
    {% if page.game_fragment == true %}
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/hacktivity-theme.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    
    {% if site.plugins contains 'jekyll-feed' %}
        <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title | escape }}" />
    {% endif %}
</head>

<body class="{% if page.game_fragment == true %}game-fragment{% endif %}">
    <script>
        // Check for embedded query parameter
        if (window.location.search.includes('embedded')) {
            document.body.classList.add('embedded-mode');
        }
    </script>
    
    {% unless page.embed or site.embedded %}
    <header class="site-header">
        <div class="wrapper">
            <a href="https://hacktivity.co.uk"><img src="{{ '/assets/images/hacktivity-logo.svg' | relative_url }}" alt="Hacktivity Logo" class="hacktivity-logo"></a></span>
            <!-- <a class="nav-link" href="{{ '/' | relative_url }}">Sheets</a>
            <a class="nav-link" href="https://github.com/{{ site.github.repository_name }}" target="_blank">GitHub</a> -->
            
        </div>
    </header>
    {% endunless %}

    <main class="page-content">
        <div class="wrapper">
            {{ content }}
        </div>
    </main>

    {% unless page.embed or site.embedded %}
    <footer class="site-footer">
        <div class="wrapper">
            <p class="footer-text">
                <a href="https://github.com/cliffe/{{ site.github.repository_name }}">View on GitHub</a>
            </p>
        </div>
    </footer>
    {% endunless %}

    <script type="module">
        // kramdown renders ```mermaid fences as <pre><code class="language-mermaid">.
        // Mermaid needs the source in an element of its own, so unwrap them first.
        // textContent also undoes kramdown's escaping of <b>/<br/> inside node labels.
        const codes = document.querySelectorAll('pre > code.language-mermaid');

        if (codes.length) {
            const hosts = [...codes].map(code => {
                const host = document.createElement('pre');
                host.className = 'mermaid';
                host.dataset.src = code.textContent;
                host.textContent = code.textContent;
                host.style.visibility = 'hidden';
                code.parentElement.replaceWith(host);
                return host;
            });

            const reveal = () => hosts.forEach(h => { h.style.visibility = ''; });

            try {
                const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');

                const render = async () => {
                    // mermaid.run() consumes the element, so restore the source each pass.
                    hosts.forEach(h => {
                        h.textContent = h.dataset.src;
                        h.removeAttribute('data-processed');
                    });
                    mermaid.initialize({
                        startOnLoad: false,
                        theme: document.body.dataset.theme === 'light' ? 'default' : 'dark',
                        flowchart: { htmlLabels: true, useMaxWidth: true }
                    });
                    await mermaid.run({ nodes: hosts });
                };

                await render();
                reveal();

                // Re-render on theme toggle: mermaid bakes colours into the generated SVG.
                new MutationObserver(render).observe(document.body, {
                    attributes: true, attributeFilter: ['data-theme']
                });
            } catch (e) {
                // CDN unreachable or a diagram failed to parse: show the graph
                // source rather than leaving a blank gap on the page.
                reveal();
                console.error('mermaid unavailable; showing diagram source', e);
            }
        }
    </script>
</body>
</html>
